name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deploy gating relies on this workflow's conclusion, so let every push finish
# its own run instead of cancelling in-progress ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is committed, so ci gives reproducible installs.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Generates route type definitions that tsc needs (Next.js typed routes).
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders: pages are prerendered without contacting
          # Supabase. Real values come from Vercel's env vars at runtime.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
